<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تواصل معنا | AHMED TECHNOLOGY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>تواصل معنا</h1>
    <p>يسعدنا استقبال استفساراتكم واقتراحاتكم</p>
   <form>
    <label for="name">اسم العميل:</label>
    <input type="text" id="name" name="name" placeholder="اكتب اسمك">
    <label for="email">البريد الإلكتروني:</label>
<input type="email" id="email" name="email" placeholder="اكتب بريدك الإلكتروني">
<label for="message">رسالتك:</label>
<textarea id="message" name="message" rows="5" placeholder="اكتب رسالتك هنا"></textarea>
<button type="submit">إرسال الرسالة</button>
</form>
</body>
</html>
